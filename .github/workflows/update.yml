name: Mise à jour quotidienne du pool
on:
  schedule:
    - cron: "0 11 * * *"   # 11h UTC = 7h (été) / 6h (hiver) au Québec, après les matchs de la veille
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update_pool.py
      - run: |
          git config user.name "hockey-draft-bot"
          git config user.email "hockey-draft-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Stats du $(date -u +%F)"
          git push
